name: experimental-spec-release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experimental-spec-release
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:canonical
      - run: pnpm native:check
      - run: node tools/release.mjs install
      - run: node tools/release.mjs qualify
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-contracts
          path: build/publication/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: qualify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          name: experimental-contracts
          path: build/publication
      - run: node tools/release.mjs install
      - name: Sign and verify exact publisher and source
        run: |
          build/release-tools/cosign sign-blob --yes --bundle build/publication/manifest.sigstore.json build/publication/manifest.json
          node tools/release.mjs verify build/publication "$GITHUB_SHA"
      - name: Publish a fresh immutable-identity prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="experimental-${GITHUB_SHA}"
          existing="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [ -n "$existing" ]; then echo 'Tag exists'; exit 1; fi
          if gh release view "$tag"; then echo 'Release exists'; exit 1; fi
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "$tag" --notes 'Experimental contract bundles; no ratification, profile activation or production qualification.' build/publication/contracts.tar build/publication/provenance.json build/publication/manifest.json build/publication/manifest.sigstore.json
          gh release edit "$tag" --draft=false
