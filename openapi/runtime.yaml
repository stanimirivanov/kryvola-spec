openapi: 3.1.0
info:
  title: Kryvola Fabric runtime API
  version: "1.1.0"
  description: |
    UTF-8 JSON control bodies are limited to 65536 bytes after decompression.
    Bulk parts and manifests use separate binary endpoints. Every route requires
    workload and tenant authorization. Digests and upload IDs confer no access.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://runtime.kryvola.invalid
    description: Reserved documentation host.
security:
  - workload: []
tags:
  - name: Runtime
    description: Artifact staging and durable execution.
paths:
  /v1/key-contexts:
    post:
      operationId: registerKeyContext
      x-kryvola-purpose: KEY_CONTEXT_REGISTER
      summary: Register an exact owner-authorized immutable key context.
      description: |
        Accept bounded canonical v1 public key-context metadata. An identical registration returns the recorded reference.
        See the approved encrypted submission contract for exact bindings and retry rules.
      tags: [Runtime]
      security:
        - workload: []
          ownerSubmissionGrant: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/RegisterKeyContextRequest"
      responses:
        "200":
          description: Exact request completed.
          content:
            application/json:
              schema:
                $ref: "../generated/control/KeyContextRef.schema.json"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/RuntimeForbidden"
        "409":
          $ref: "#/components/responses/RuntimeConflict"
        "429":
          $ref: "#/components/responses/OwnerSubmissionLimited"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/input-uploads:
    post:
      operationId: createInputUpload
      x-kryvola-purpose: INPUT_UPLOAD_RESERVE
      summary: Reserve a private input upload before operation admission.
      description: |
        Reserve by registered key context and idempotency key. An identical retry returns the same upload ID.
        See the approved encrypted submission contract for exact bindings and retry rules.
      tags: [Runtime]
      security:
        - workload: []
          ownerSubmissionGrant: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/CreateInputUploadRequest"
      responses:
        "201":
          description: Exact request completed.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/CreateUploadResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/RuntimeForbidden"
        "409":
          $ref: "#/components/responses/RuntimeConflict"
        "429":
          $ref: "#/components/responses/OwnerSubmissionLimited"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/input-uploads/{upload_id}/parts/{part_index}:
    put:
      operationId: putInputUploadPart
      x-kryvola-purpose: INPUT_UPLOAD_PART
      summary: Stage one indexed encrypted input or evaluation-key part.
      description: |
        Upload the complete part of at most 4194304 bytes. An identical retry succeeds and changed bytes conflict.
        See the approved encrypted submission contract for exact bindings and retry rules.
      tags: [Runtime]
      security:
        - workload: []
          ownerSubmissionGrant: []
      parameters:
        - $ref: "#/components/parameters/upload_id"
        - $ref: "#/components/parameters/part_index"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Exact request completed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/RuntimeForbidden"
        "409":
          $ref: "#/components/responses/RuntimeConflict"
        "429":
          $ref: "#/components/responses/OwnerSubmissionLimited"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/input-uploads/{upload_id}/manifest:
    put:
      operationId: putInputUploadManifest
      x-kryvola-purpose: INPUT_UPLOAD_MANIFEST
      summary: Stage the exact canonical v2 input manifest.
      description: |
        Upload at most 65536 bytes. The manifest must match the reserved kind, context and digest.
        See the approved encrypted submission contract for exact bindings and retry rules.
      tags: [Runtime]
      security:
        - workload: []
          ownerSubmissionGrant: []
      parameters:
        - $ref: "#/components/parameters/upload_id"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Exact request completed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/RuntimeForbidden"
        "409":
          $ref: "#/components/responses/RuntimeConflict"
        "429":
          $ref: "#/components/responses/OwnerSubmissionLimited"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/input-uploads/{upload_id}/finalize:
    post:
      operationId: finalizeInputUpload
      x-kryvola-purpose: INPUT_UPLOAD_FINALIZE
      summary: Finalize verified immutable input bytes.
      description: |
        Verify the manifest and all indexed parts before publishing. An identical retry returns the same digest.
        See the approved encrypted submission contract for exact bindings and retry rules.
      tags: [Runtime]
      security:
        - workload: []
          ownerSubmissionGrant: []
      parameters:
        - $ref: "#/components/parameters/upload_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/FinalizeUploadRequest"
      responses:
        "200":
          description: Exact request completed.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/FinalizeUploadResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/RuntimeForbidden"
        "409":
          $ref: "#/components/responses/RuntimeConflict"
        "429":
          $ref: "#/components/responses/OwnerSubmissionLimited"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/compute-approvals:
    post:
      operationId: registerComputeApproval
      x-kryvola-purpose: COMPUTE_APPROVAL_REGISTER
      summary: Record an exact signed owner compute approval.
      description: |
        Verify canonical metadata, current policy, signer and approval validity. This route does not admit an operation.
        See the approved encrypted submission contract for exact bindings and retry rules.
      tags: [Runtime]
      security:
        - workload: []
          ownerSubmissionGrant: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/RegisterComputeApprovalRequest"
      responses:
        "200":
          description: Exact request completed.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/RegisterComputeApprovalResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/RuntimeForbidden"
        "409":
          $ref: "#/components/responses/RuntimeConflict"
        "429":
          $ref: "#/components/responses/OwnerSubmissionLimited"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/operations/admit:
    post:
      operationId: admitApprovedOperation
      x-kryvola-purpose: APPROVED_OPERATION_ADMIT
      summary: Admit an exact approved operation using immutable references.
      description: |
        Atomically verify and pin the registered key context, signed approval and finalized inputs before enqueueing. An identical authorized retry returns the recorded operation.
        See the approved encrypted submission contract for exact bindings and retry rules.
      tags: [Runtime]
      security:
        - workload: []
          ownerSubmissionGrant: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/AdmitApprovedOperationRequest"
      responses:
        "200":
          description: Exact request completed.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/OperationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/RuntimeForbidden"
        "409":
          $ref: "#/components/responses/RuntimeConflict"
        "429":
          $ref: "#/components/responses/OwnerSubmissionLimited"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/uploads:
    post:
      operationId: createUpload
      summary: Reserve quota and create a private staged upload.
      tags: [Runtime]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Request completed.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/CreateUploadResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/uploads/{upload_id}/parts/{part_index}:
    put:
      operationId: putUploadPart
      summary: Stage one indexed part of at most 4194304 bytes.
      tags: [Runtime]
      parameters:
        - $ref: "#/components/parameters/upload_id"
        - $ref: "#/components/parameters/part_index"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Request completed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/uploads/{upload_id}/manifest:
    put:
      operationId: putUploadManifest
      summary: Stage a canonical manifest of at most 65536 bytes.
      tags: [Runtime]
      parameters:
        - $ref: "#/components/parameters/upload_id"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Request completed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/uploads/{upload_id}/finalize:
    post:
      operationId: finalizeUpload
      summary: Verify staged bytes and the manifest commitment before publishing an immutable reference.
      tags: [Runtime]
      parameters:
        - $ref: "#/components/parameters/upload_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/FinalizeUploadRequest"
      responses:
        "200":
          description: Request completed.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/FinalizeUploadResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/operations:
    post:
      operationId: createOperation
      summary: Return the recorded operation on an identical retry.
      tags: [Runtime]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/CreateOperationRequest"
      responses:
        "200":
          description: Request completed.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/OperationResponse"
        "409":
          description: IDEMPOTENCY_CONFLICT for changed intent.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/RuntimeError"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/operations/{operation_id}:
    get:
      operationId: getOperation
      summary: Read authorized operation metadata. Selection does not grant disclosure.
      tags: [Runtime]
      parameters:
        - $ref: "#/components/parameters/operation_id"
      responses:
        "200":
          description: Request completed.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/OperationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/attempts/ensure:
    post:
      operationId: ensureAttempt
      summary: Return an attempt with a coordinator-assigned fence. Retired epochs cannot reacquire leases.
      tags: [Runtime]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/EnsureAttemptRequest"
      responses:
        "200":
          description: Request completed.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/EnsureAttemptResponse"
        "409":
          description: ATTEMPT_EXPIRED for a retired epoch.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/RuntimeError"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/results/select:
    post:
      operationId: selectResult
      summary: Select one matching result under a live fence without granting disclosure.
      tags: [Runtime]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/SelectResultRequest"
      responses:
        "200":
          description: Request completed.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/SelectResultResponse"
        "409":
          description: STALE_FENCE or ATTEMPT_EXPIRED.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/RuntimeError"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/operations/cancel:
    post:
      operationId: cancelOperation
      summary: Acknowledge cancellation only after the tombstone and fence commit.
      tags: [Runtime]
      requestBody: &cancelRequest
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/CancelOperationRequest"
      responses: &cancelResponses
        "200":
          description: Cancellation fence committed.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/Cancelled"
        "202":
          description: Cancellation barrier is unconfirmed. Retry with the same idempotency key.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/CancellationPending"
        "409":
          description: IDEMPOTENCY_CONFLICT for changed intent.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/RuntimeError"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/artifact-access/authorize:
    post:
      operationId: authorizeArtifact
      summary: Scope access to the authenticated caller, attempt, manifest and purpose. Carry any credential only in transport metadata.
      tags: [Runtime]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/AuthorizeArtifactRequest"
      responses:
        "200":
          description: Request completed.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/AuthorizeArtifactResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/compute-inputs/manifest:
    post:
      operationId: readComputeInputManifest
      x-kryvola-purpose: COMPUTE_READ
      summary: Read a finalized canonical compute-input manifest.
      description: |
        Returns the exact canonical v2 manifest bytes for the requested digest, up to 65536 bytes.
        Redeem a fresh single-use COMPUTE_READ grant in Authorization metadata.
        Admission requires the exact current attempt and an immutable input listed in
        the operation's approved input digests for the same tenant and key context.
        See the runtime compute-input read contract for fencing and integrity rules.
      tags: [Runtime]
      security:
        - workload: []
          computeReadGrant: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/ReadComputeInputRequest"
      responses:
        "200":
          description: Complete verified bytes. The body is uncompressed.
          headers:
            Content-Length:
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 65536
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/RuntimeForbidden"
        "404":
          $ref: "#/components/responses/ComputeInputNotFound"
        "409":
          $ref: "#/components/responses/RuntimeConflict"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/compute-inputs/parts/{part_index}:
    post:
      operationId: readComputeInputPart
      x-kryvola-purpose: COMPUTE_READ
      summary: Read one verified compute-input part.
      description: |
        Returns the complete indexed part, up to 4194304 bytes. Range and partial responses are forbidden.
        Redeem a fresh single-use COMPUTE_READ grant in Authorization metadata.
        Admission requires the exact current attempt and an immutable input listed in
        the operation's approved input digests for the same tenant and key context.
        See the runtime compute-input read contract for fencing and integrity rules.
      tags: [Runtime]
      security:
        - workload: []
          computeReadGrant: []
      parameters:
        - $ref: "#/components/parameters/part_index"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/ReadComputeInputRequest"
      responses:
        "200":
          description: Complete verified bytes. The body is uncompressed.
          headers:
            Content-Length:
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 4194304
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/RuntimeForbidden"
        "404":
          $ref: "#/components/responses/ComputeInputNotFound"
        "409":
          $ref: "#/components/responses/RuntimeConflict"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/released-outputs/manifest:
    post:
      operationId: readReleasedOutputManifest
      x-kryvola-purpose: CONSUMER_READ
      summary: Read the canonical manifest of an exact committed release.
      description: |
        Returns the exact canonical v2 manifest bytes for the requested digest, up to 65536 bytes.
        Redeem a fresh single-use CONSUMER_READ grant in Authorization metadata.
        Bind the grant and verified recipient workload to the exact request and route target.
        Revalidate the committed release, its current policy and barriers on every read.
        Serve only verified bytes from the immutable upload recorded in that release.
        Range, query parameters, partial responses and storage redirects are forbidden.
      tags: [Runtime]
      security:
        - workload: []
          consumerReadGrant: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/ReadReleasedOutputRequest"
      responses:
        "200":
          description: Complete verified bytes. The body is uncompressed.
          headers:
            Content-Length:
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 65536
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/ReleasedOutputForbidden"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/released-outputs/parts/{part_index}:
    post:
      operationId: readReleasedOutputPart
      x-kryvola-purpose: CONSUMER_READ
      summary: Read one verified part of an exact committed release.
      description: |
        Returns the complete indexed part, up to 4194304 bytes. Range and partial responses are forbidden.
        Redeem a fresh single-use CONSUMER_READ grant in Authorization metadata.
        Bind the grant and verified recipient workload to the exact request and route target.
        Revalidate the committed release, its current policy and barriers on every read.
        Serve only verified bytes from the immutable upload recorded in that release.
        Range, query parameters, partial responses and storage redirects are forbidden.
      tags: [Runtime]
      security:
        - workload: []
          consumerReadGrant: []
      parameters:
        - $ref: "#/components/parameters/part_index"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/ReadReleasedOutputRequest"
      responses:
        "200":
          description: Complete verified bytes. The body is uncompressed.
          headers:
            Content-Length:
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 4194304
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/ReleasedOutputForbidden"
        "404":
          $ref: "#/components/responses/ReleasedOutputPartNotFound"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/uploads/{upload_id}/abort:
    post:
      operationId: abortUpload
      summary: Commit abort of a private staged upload.
      description: |
        Requires the authenticated workload's COMPUTE_WRITE authority for the
        exact attempt and upload. Cross-tenant or mismatched upload scope is denied.
        Retry the same scoped request after interruption. 204 confirms committed
        staging unreachability; physical cleanup may be retried. 404 means absent
        or already reclaimed, never permission to access another tenant's data.
      x-kryvola-purpose: COMPUTE_WRITE
      tags: [Runtime]
      parameters:
        - $ref: "#/components/parameters/upload_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/AbortUploadRequest"
      responses:
        "204":
          description: Abort committed; upload cannot be finalized or read.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/RuntimeForbidden"
        "404":
          $ref: "#/components/responses/RuntimeNotFound"
        "409":
          $ref: "#/components/responses/RuntimeConflict"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/executions/output-grants:
    post:
      operationId: issueOutputGrant
      summary: Issue one single-use grant for an exact execution output action.
      description: |
        Requires an EXECUTION_OUTPUT_GRANT capability for the authenticated
        workload and registered execution on the current live attempt. Returns
        the newly minted COMPUTE_WRITE bearer only in Kryvola-Output-Grant.
        The grant is restricted to the exact output manifest and requested
        upload action. See the scoped output grant contract for reservation,
        fencing, retries and credential handling.
      x-kryvola-purpose: EXECUTION_OUTPUT_GRANT
      tags: [Runtime]
      security:
        - workload: []
          outputGrantAuthority: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/IssueOutputGrantRequest"
      responses:
        "200":
          description: Single-use upload authorization issued.
          headers:
            Kryvola-Output-Grant:
              required: true
              description: Use as the bearer token on the matching upload request.
              schema:
                type: string
                pattern: '^[0-9a-f]{64}(?![\s\S])'
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/IssueOutputGrantResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/RuntimeForbidden"
        "404":
          $ref: "#/components/responses/RuntimeNotFound"
        "409":
          $ref: "#/components/responses/RuntimeConflict"
        "413":
          $ref: "#/components/responses/Rejected"
        "429":
          $ref: "#/components/responses/Rejected"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/executions/receipt:
    post:
      operationId: persistExecutionReceipt
      summary: Commit a signed provenance receipt for one physical execution.
      description: |
        Requires EXECUTION_RECEIPT_WRITE authority for the verified workload and
        exact live execution. Verify the canonical v3 receipt and signature, and
        bind them to the registered execution and its finalized output upload
        before acknowledging a durable commit. Identical authorized retries return
        the same digest. A changed binding conflicts. See the signed execution
        receipt contract for trust, fencing and replay rules.
      x-kryvola-purpose: EXECUTION_RECEIPT_WRITE
      tags: [Runtime]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/PersistExecutionReceiptRequest"
      responses:
        "200":
          description: Receipt is durably bound to the execution and output.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/PersistExecutionReceiptResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/RuntimeForbidden"
        "404":
          $ref: "#/components/responses/RuntimeNotFound"
        "409":
          $ref: "#/components/responses/RuntimeConflict"
        "413":
          $ref: "#/components/responses/Rejected"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/executions/register:
    post:
      operationId: registerExecution
      summary: Register a physical execution against one live attempt.
      description: |
        Requires coordinator EXECUTION_REGISTER authority for the request's tenant,
        operation, workflow epoch, attempt epoch and fence. The server compares plan
        and policy digests with authoritative operation metadata. Identical retries
        succeed only while the attempt remains live and the operation remains open;
        reusing an execution id for a different attempt is rejected. Registration
        grants neither result selection nor artifact read or disclosure authority.
      x-kryvola-purpose: EXECUTION_REGISTER
      tags: [Runtime]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/RegisterExecutionRequest"
      responses:
        "204":
          description: Registration committed for this live attempt.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/RuntimeForbidden"
        "404":
          $ref: "#/components/responses/RuntimeNotFound"
        "409":
          $ref: "#/components/responses/RuntimeConflict"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
  /v1/admin/operations/cancel:
    post:
      operationId: adminCancelOperation
      summary: Fence an operation before administrative termination.
      description: |
        Requires separate ADMIN_CANCEL authority for the authenticated administrator,
        tenant and operation; public cancellation authority is insufficient. Uses
        the same committed barrier and idempotency semantics as public cancellation.
        Registry unavailability returns 202 CANCELLATION_PENDING, never CANCELLED.
        Temporal termination must wait for the committed 200 response.
      x-kryvola-purpose: ADMIN_CANCEL
      tags: [Runtime]
      requestBody: *cancelRequest
      responses: *cancelResponses
  /v1/admin/operations/fence-recovery:
    post:
      operationId: fenceRecovery
      summary: Commit recovery quarantine without admitting a successor.
      description: |
        Requires ADMIN_RECOVERY authority for the authenticated administrator, tenant,
        operation and current workflow epoch. The server allocates the barrier fence
        and successor epoch; callers cannot supply them. First fencing advances the
        stored fence and sets successor_epoch to workflow_epoch + 1; overflow rejects
        with 409 STALE_FENCE. A 200 response follows
        transaction commit only. Identical retries return the same barrier; stale,
        cancelled or exhausted epochs reject. 503 UNAVAILABLE is not acknowledgement
        of fencing and the same request may be retried. RECOVERY_FENCED is quarantine,
        never recovery admission, workflow resumption or disclosure authorization.
      x-kryvola-purpose: ADMIN_RECOVERY
      tags: [Runtime]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./runtime.schemas.json#/components/schemas/FenceRecoveryRequest"
      responses:
        "200":
          description: Barrier committed; successor_epoch is a recovery target only.
          content:
            application/json:
              schema:
                $ref: "./runtime.schemas.json#/components/schemas/RecoveryFenceResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/RuntimeForbidden"
        "404":
          $ref: "#/components/responses/RuntimeNotFound"
        "409":
          $ref: "#/components/responses/RuntimeConflict"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"
        default:
          $ref: "#/components/responses/Rejected"
components:
  securitySchemes:
    workload:
      type: mutualTLS
      description: Verified client workload identity.
    ownerSubmissionGrant:
      type: http
      scheme: bearer
      description: Owner submission authority bound to the verified workload, exact tenant, action and target. Separate from execution and consumer grants.
    computeReadGrant:
      type: http
      scheme: bearer
      description: Fresh single-use COMPUTE_READ grant bound to the verified workload and exact request scope.
    consumerReadGrant:
      type: http
      scheme: bearer
      description: Fresh single-use CONSUMER_READ grant for the verified recipient workload, exact release and manifest or indexed part target.
    outputGrantAuthority:
      type: http
      scheme: bearer
      description: Separate issuance capability bound to the verified workload and exact execution.
  responses:
    OwnerSubmissionLimited:
      description: "QUOTA_EXCEEDED: submission rate or quota limit reached. Retry with the original identity."
      content:
        application/json:
          schema:
            $ref: "./runtime.schemas.json#/components/schemas/RuntimeError"
    RuntimeForbidden:
      description: "FORBIDDEN: workload/purpose, tenant or context/plan/policy binding denied."
      content:
        application/json:
          schema:
            $ref: "./runtime.schemas.json#/components/schemas/RuntimeForbiddenError"
    ReleasedOutputForbidden:
      description: "FORBIDDEN: missing or ineligible release, or denied workload, credential, recipient or output binding."
      content:
        application/json:
          schema:
            $ref: "./runtime.schemas.json#/components/schemas/RuntimeForbiddenError"
    ReleasedOutputPartNotFound:
      description: "NOT_FOUND: index absent from an authorized released manifest."
      content:
        application/json:
          schema:
            $ref: "./runtime.schemas.json#/components/schemas/RuntimeNotFoundError"
    ComputeInputNotFound:
      description: "NOT_FOUND: no visible finalized input or indexed part in the authorized scope."
      content:
        application/json:
          schema:
            $ref: "./runtime.schemas.json#/components/schemas/RuntimeNotFoundError"
    RuntimeNotFound:
      description: "NOT_FOUND: no visible operation or upload in the authorized scope."
      content:
        application/json:
          schema:
            $ref: "./runtime.schemas.json#/components/schemas/RuntimeNotFoundError"
    RuntimeConflict:
      description: "ATTEMPT_EXPIRED for dead leases; STALE_FENCE for stale/closed/cancelled or exhausted epochs, or an execution id bound to another attempt; IDEMPOTENCY_CONFLICT for changed retry intent."
      content:
        application/json:
          schema:
            $ref: "./runtime.schemas.json#/components/schemas/RuntimeConflictError"
    RuntimeUnavailable:
      description: "UNAVAILABLE: dependency failure; no durable success is acknowledged. Retry the same scoped request."
      content:
        application/json:
          schema:
            $ref: "./runtime.schemas.json#/components/schemas/RuntimeUnavailableError"
    InvalidRequest:
      description: Invalid runtime request.
      content:
        application/json:
          schema:
            $ref: "./runtime.schemas.json#/components/schemas/RuntimeError"
    Rejected:
      description: Bounded rejection code.
      content:
        application/json:
          schema:
            $ref: "./runtime.schemas.json#/components/schemas/RuntimeError"
  parameters:
    upload_id:
      name: upload_id
      in: path
      required: true
      description: Runtime upload id.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}(?![\s\S])'
    part_index:
      name: part_index
      in: path
      required: true
      description: Runtime part index.
      schema:
        type: integer
        minimum: 0
        maximum: 1023
    operation_id:
      name: operation_id
      in: path
      required: true
      description: Runtime operation id.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}(?![\s\S])'
